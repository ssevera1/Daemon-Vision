// Root build file for Daemon Vision Companion App
// -----------------------------------------------
// Repositories are declared once in settings.gradle
// (dependencyResolutionManagement), which sets FAIL_ON_PROJECT_REPOS. An
// allprojects { repositories {...} } block here conflicts with that and
// Gradle refuses to configure the build at all.

plugins {
    id 'com.android.application' version '8.2.2' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
