// Root build file for Daemon Vision Companion App
// ─────────────────────────────────────────────────

plugins {
    id 'com.android.application' version '8.2.2' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
