# Companion app Gradle properties.

# All dependencies (androidx.appcompat, androidx.biometric, material, etc.)
# are already AndroidX; the Support Library era is long gone, so no jetifier
# is needed. Without useAndroidX=true, AGP 8 refuses to configure the build
# at all (checkDebugAarMetadata fails with "Configuration ... contains
# AndroidX dependencies, but the android.useAndroidX property is not
# enabled").
android.useAndroidX=true
android.enableJetifier=false

# AndroidX-generated R classes, matching every androidx.* dependency here.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
