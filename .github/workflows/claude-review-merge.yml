name: Claude Review & Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The action fails hard when the token is absent, which would put a red
      # X on every PR until the secret is configured. Skip instead, loudly.
      - name: Check reviewer credentials
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "present=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set; automated review skipped. Run D:\\Claude\\scripts\\set-claude-oauth-secret.ps1."
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an automated code reviewer. The PR branch is already
            checked out in the current working directory. Review the full
            diff (`gh pr diff ${{ github.event.pull_request.number }}`) for:
            - Correctness and logic bugs
            - Security issues (injection, path traversal, secret leakage,
              unsafe error handling that swallows real failures)
            - Whether the change actually matches the intent of the PR
              title/description
            - Whether it's reasonably scoped (no unrelated changes bundled in)

            Decide APPROVE or REQUEST_CHANGES, then act on it:

            - If the change is correct, safe, and reasonably scoped:
              run `gh pr review ${{ github.event.pull_request.number }} --approve --body "<2-3 sentence summary of what you checked and why it's safe>"`
              then run `gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch`.
              (`--auto` waits for CI to go green before it actually merges —
              you do not need to check CI status yourself, and you should not
              merge if you have any doubt about correctness.)
            - If you find a real problem, are unsure, or the diff is doing
              something beyond its stated scope:
              run `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<specific, actionable feedback tied to line numbers>"`
              and do NOT run `gh pr merge`.

            Post exactly one review. Do not also leave a separate top-level
            comment repeating the review body.
          # Runs on the Pro subscription, not the API key, so Opus costs nothing
          # in dollars and effort is free to sit at high. It draws on the Pro
          # 5-hour limits instead, which is why the schedule keeps these runs in
          # the small hours, away from interactive sessions. Plain claude-opus-5,
          # never claude-opus-5[1m]: on Pro, Opus with 1M context draws credits.
          claude_args: |
            --model claude-opus-5
            --effort high
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
