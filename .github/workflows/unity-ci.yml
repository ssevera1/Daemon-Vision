name: Unity Tests

# Runs the EditMode test suite under Assets/Tests with GameCI. Needs a Unity
# licence, which lives in repository secrets:
#   UNITY_LICENSE   contents of the .ulf activation file (personal licence), or
#   UNITY_SERIAL    plus UNITY_EMAIL and UNITY_PASSWORD (pro / plus)
# See https://game.ci/docs/github/activation. Until UNITY_LICENSE is set the
# test job is skipped rather than failed, so ci.yml stays the required check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  check-license:
    name: Licence present?
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          # secrets are not available in a job-level if, so surface it as an output
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
        run: |
          echo "has_license=${HAS_LICENSE}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_LICENSE}" != "true" ]; then
            echo "::notice::UNITY_LICENSE is not configured; skipping Unity EditMode tests."
          fi

  edit-mode-tests:
    name: EditMode tests
    needs: check-license
    if: needs.check-license.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: unity-project/Library
          key: Library-${{ hashFiles('unity-project/Packages/manifest.json', 'unity-project/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-project
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14
